name: Deploy site and CV

# Builds the Jekyll site and the CV PDF together and deploys them as one Pages
# artifact. The CV PDF is generated from the same publications.json as the
# website, placed at pdfs/CV.pdf, and included in the built site — so the
# published CV is always in sync, with no committed binary and no manual step.
#
# This is the single CI workflow. On pull_request the build job runs full
# validation (data-sync checks, generator self-checks, and rendered-page
# assertions) but does NOT deploy; on push to master it also deploys.
# Requires the repo's Pages source to be set to "GitHub Actions".

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Build the CV PDF from the shared source and place it where the site
      #    serves it (pdfs/CV.pdf). cv/papers.bib is generated, not committed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      # Fast fail-fast data checks: committed generated files (publications.yml,
      # cv/papers.bib) are in sync with their canonical source, and each
      # generator passes its self-check.
      - name: Committed generated files are up to date
        run: python3 scripts/build.py --check
      - name: Generator self-checks
        run: |
          set -euo pipefail
          for t in tests/test_*.py; do echo "== $t =="; python3 "$t"; done
      # Materialise every generated artifact from the canonical data: the CV
      # fragments, cv/papers.bib, and the /slides/ page (scripts/build.py).
      - name: Materialise all generated files
        run: python3 scripts/build.py
      - name: Build CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: main.tex
      - name: Assert CV content
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdftotext -layout cv/main.pdf cv.txt
          # Run every check, report all misses, then fail once (a bare `grep -q`
          # would both hide which string was missing and stop at the first).
          fail=0
          have() { grep -qF -- "$2" "$1" || { echo "::error::CV PDF missing: $2"; fail=1; }; }
          have cv.txt "FittingsTheorem"                        # preprint present
          have cv.txt "github.com/adomani/FittingsTheorem"     # repo link shown
          have cv.txt "Néron"                                  # UTF-8 accent renders
          have cv.txt "Superficies Racionales sobre un Cuerpo" # minicourse (shared data)
          have cv.txt "CIMPA"                                  # cv_only entry IS on the CV
          have cv.txt "Metaprogramming in Lean"                # a talk (shared data)
          have cv.txt "18.701 Algebra, Grader"                 # teaching table (shared data)
          have cv.txt "Using computers to do maths for us"     # Tour of Mathematics (teaching)
          have cv.txt "Frontiers of rationality"               # organized conference (shared data)
          [ "$fail" -eq 0 ] || { echo "::error::CV content assertions failed (see above)"; exit 1; }
          echo "CV assertions passed."
      - name: Place CV PDF into the site
        run: cp cv/main.pdf pdfs/CV.pdf

      # 2. Build the Jekyll site (the /slides/ page and CV PDF are already in
      #    place from the build.py step above).
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Assert CV PDF is in the built site
        run: test -s _site/pdfs/CV.pdf
      - name: Assert internal sources are NOT published (only the CV artifact is)
        run: |
          set -euo pipefail
          test ! -e _site/cv       # LaTeX CV sources excluded
          test ! -e _site/scripts  # Python pipeline excluded
          test ! -e _site/tests    # generator self-checks excluded
          test ! -e _site/README.md && test ! -e _site/README.html  # repo README not a site page
          test -s _site/pdfs/CV.pdf # ...but the CV PDF artifact is still served
          echo "internal sources excluded; CV PDF still served."
      - name: Assert rendered pages (report every failing check, not just the first)
        run: |
          set -euo pipefail
          # Run all checks, collecting failures, then fail once at the end — so a
          # single missing pattern doesn't shadow the rest. Each helper names the
          # file and pattern; `seen` guards a missing page (reported once).
          fail=0
          seen() { if [ -s "$1" ]; then return 0; fi; echo "::error::missing or empty: $1"; fail=1; return 1; }
          have() { grep -qF -- "$2" "$1" || { echo "::error::missing in $1: $2"; fail=1; }; }
          lack() { if grep -qF -- "$2" "$1"; then echo "::error::unexpected in $1: $2"; fail=1; fi; }
          no_raw_math() { if grep -qE '\$[^$]*\\[a-zA-Z]+[^$]*\$' "$1"; then echo "::error::raw \$...\$ math leaked in $1 (MathJax expects \\(..\\))"; fail=1; fi; }

          # /papers/ (from publications.json) + the MathJax v3 loader
          f=_site/papers/index.html
          if seen "$f"; then
            have "$f" "A Macaulay2-Lean interface for proofs in Lean"   # known entry
            have "$f" "Gröbner"                                          # UTF-8 accent
            have "$f" "Néron"
            have "$f" '<details class="pub">'                            # collapsible entry present
            have "$f" '<span class="pub-title">'                         # titles wrapped/emphasised
            have "$f" "theta-hyperplanes"                                # a migrated description
            have "$f" 'href="https://anne.mx/"'                          # co-author homepage link
            have "$f" "Dedicated to Tony Mach"                           # citation_note (dedication)
            have "$f" 'supervisor <a href="https://www.math.columbia.edu/~dejong/"'  # thesis credit
            have "$f" '\(28\)'                                           # inline math delimiter for MathJax
            have "$f" 'cdn.jsdelivr.net/npm/mathjax@3'                   # modern MathJax v3 CDN
            lack "$f" 'cdn.mathjax.org'                                  # retired v2 shim CDN gone
            lack "$f" 'pugwash'                                          # no proxied URL leaked
            no_raw_math "$f"
          fi

          # /slides/
          f=_site/slides/index.html
          if seen "$f"; then
            have "$f" "2021_11_29_lines_Alt.pdf"            # a slide PDF (shared data)
            have "$f" "watch?v=734jMwgjkkM"                 # a video link
            have "$f" "Using computers to do maths for us"  # web_only entry present
            have "$f" "Castravet-Tevelev"                   # expository note
            no_raw_math "$f"
          fi

          # /minicourses/
          f=_site/minicourses/index.html
          if seen "$f"; then
            have "$f" "Superficies Racionales sobre un Cuerpo"  # a shared entry
            have "$f" "boojum.org.uk"                           # collaborator link (Martin Bright)
            lack "$f" "CIMPA"                                   # cv_only entry hidden from the website
          fi

          # /msrp/ (collaborator.html resolved via _data/collaborators.yml)
          f=_site/msrp/index.html
          if seen "$f"; then
            have "$f" '<a href="https://www.boojum.org.uk/maths/">Martin Bright</a>'
            have "$f" '<a href="https://pub.math.leidenuniv.nl/~luijkrmvan/">Ronald van Luijk</a>'
          fi

          # /teaching/ + past_teaching (course.html resolved via _data/courses.yml)
          f=_site/teaching/index.html
          if seen "$f"; then have "$f" "MA4N1 Theorem Proving with Lean"; fi   # current-term course
          f=_site/teaching/past_teaching/index.html
          if seen "$f"; then
            have "$f" "MA4N1 Theorem Proving with Lean"  # same course on the history page
            have "$f" "Manifolds_2023.pdf"               # a course's extra "links" resolved
            have "$f" "MA3J9/3rd.pdf"                    # a course's "notes" markdown resolved
            have "$f" "GitHub logo"                      # the github icon (octocat) resolved
          fi

          [ "$fail" -eq 0 ] || { echo "::error::one or more rendered-page assertions failed (see above)"; exit 1; }
          echo "All rendered-page assertions passed."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    # Never deploy from a pull request; only from master pushes / manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
