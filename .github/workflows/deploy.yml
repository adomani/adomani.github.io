name: Deploy site and CV

# Builds the Jekyll site and the CV PDF together and deploys them as one Pages
# artifact. The CV PDF is generated from the same publications.json as the
# website, placed at pdfs/CV.pdf, and included in the built site — so the
# published CV is always in sync, with no committed binary and no manual step.
#
# On pull_request the build job runs (validation) but does NOT deploy.
# Requires the repo's Pages source to be set to "GitHub Actions".

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Build the CV PDF from the shared source and place it where the site
      #    serves it (pdfs/CV.pdf). cv/papers.bib is generated, not committed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      # Materialise every generated artifact from the canonical data: the CV
      # fragments, cv/papers.bib, and the /slides/ page (scripts/build.py).
      - name: Materialise all generated files
        run: python3 scripts/build.py
      - name: Build CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: main.tex
      - name: Assert CV content
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdftotext -layout cv/main.pdf cv.txt
          grep -q "FittingsTheorem" cv.txt                      # preprint present
          grep -q "github.com/adomani/FittingsTheorem" cv.txt   # repo link shown
          grep -q "Néron" cv.txt                                # UTF-8 accent renders
          grep -q "Superficies Racionales sobre un Cuerpo" cv.txt  # minicourse (shared data)
          grep -q "CIMPA" cv.txt                                # cv_only entry IS on the CV
          grep -q "Metaprogramming in Lean" cv.txt              # a talk (shared data)
          grep -q "18.701 Algebra, Grader" cv.txt               # teaching table (shared data)
          grep -q "Using computers to do maths for us" cv.txt   # Tour of Mathematics (teaching)
          grep -q "Frontiers of rationality" cv.txt             # organized conference (shared data)
          echo "CV assertions passed."
      - name: Place CV PDF into the site
        run: cp cv/main.pdf pdfs/CV.pdf

      # 2. Build the Jekyll site (the /slides/ page and CV PDF are already in
      #    place from the build.py step above).
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Assert CV PDF is in the built site
        run: test -s _site/pdfs/CV.pdf
      - name: Assert internal sources are NOT published (only the CV artifact is)
        run: |
          set -euo pipefail
          test ! -e _site/cv       # LaTeX CV sources excluded
          test ! -e _site/scripts  # Python pipeline excluded
          test ! -e _site/tests    # generator self-checks excluded
          test ! -e _site/README.md && test ! -e _site/README.html  # repo README not a site page
          test -s _site/pdfs/CV.pdf # ...but the CV PDF artifact is still served
          echo "internal sources excluded; CV PDF still served."
      - name: Assert /slides/ page renders from shared data
        run: |
          set -euo pipefail
          f=_site/slides/index.html
          test -s "$f"
          grep -q "2021_11_29_lines_Alt.pdf" "$f"     # a slide PDF (shared data)
          grep -q "watch?v=734jMwgjkkM" "$f"          # a video link
          grep -q "Using computers to do maths for us" "$f"  # web_only entry present
          echo "Slides page assertions passed."
      - name: Assert minicourses page renders from shared data
        run: |
          set -euo pipefail
          f=_site/minicourses/index.html
          test -s "$f"
          grep -q "Superficies Racionales sobre un Cuerpo" "$f"   # a shared entry
          grep -q "boojum.org.uk" "$f"                            # collaborator link (Martin Bright)
          ! grep -q "CIMPA" "$f"                                  # cv_only entry hidden from the website
      - name: Assert msrp page links collaborators from the shared map
        run: |
          set -euo pipefail
          f=_site/msrp/index.html
          test -s "$f"
          # The generic collaborator.html include resolved names via _data/collaborators.yml.
          grep -qF '<a href="https://www.boojum.org.uk/maths/">Martin Bright</a>' "$f"
          grep -qF '<a href="https://pub.math.leidenuniv.nl/~luijkrmvan/">Ronald van Luijk</a>' "$f"
          echo "msrp collaborator-include assertions passed."
      - name: Assert teaching pages render courses from _data/courses.yml
        run: |
          set -euo pipefail
          cur=_site/teaching/index.html
          past=_site/teaching/past_teaching/index.html
          test -s "$cur" && test -s "$past"
          grep -q "MA4N1 Theorem Proving with Lean" "$cur"      # current-term course via the include
          grep -q "MA4N1 Theorem Proving with Lean" "$past"     # same course, data-driven, on the history page
          grep -q "Manifolds_2023.pdf" "$past"                  # a course's extra "links" resolved
          grep -q "MA3J9/3rd.pdf" "$past"                       # a course's "notes" markdown resolved
          grep -q "GitHub logo" "$past"                         # the github icon (octocat) resolved
          echo "teaching course-include assertions passed."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    # Never deploy from a pull request; only from master pushes / manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
