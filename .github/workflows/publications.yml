name: Validate publications pipeline

# Validate-only: builds and checks the generated publications page on PRs.
# It does NOT publish anything — the live site is still deployed by GitHub
# Pages from the default branch. This gives a green/red signal on the
# data + template before a change is merged.

on:
  pull_request:
    paths:
      - '_bibliography/papers.bib'
      - '_data/publications.yml'
      - 'scripts/bib2yaml.py'
      - '_includes/pub_entry.html'
      - 'papers-generated/**'
      - 'tests/**'
      - '.github/workflows/publications.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml

      # 1. Golden-file check: the committed data matches what papers.bib produces.
      #    Catches "edited the .bib but forgot to regenerate" and converter drift.
      - name: publications.yml is up to date with papers.bib
        run: python3 scripts/bib2yaml.py _bibliography/papers.bib _data/publications.yml --check

      # 2. Fixture test: pins the converter's behaviour against a golden output.
      - name: Converter fixture test
        run: python3 tests/test_bib2yaml.py

      # 3. Build the whole site (catches Liquid/template/theme errors).
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      # 4. Post-build assertions: the rendered page actually looks right.
      - name: Assert rendered publications page
        run: |
          set -euo pipefail
          f=_site/papers-generated/index.html
          test -s "$f"                                        # exists & non-empty
          grep -q "A Macaulay2-Lean interface for proofs in Lean" "$f"  # known entry
          grep -q "Gröbner" "$f"                              # UTF-8 accent rendered
          grep -q "Néron" "$f"
          grep -qF '\(3 \times 3\)' "$f"                      # inline math uses \(..\) for MathJax
          if grep -qE '\$[^$]*\\[a-zA-Z]+[^$]*\$' "$f"; then
            echo "::error::a raw \$...\$ math span leaked (site MathJax expects \\(..\\))"; exit 1
          fi
          if grep -q "pugwash" "$f"; then
            echo "::error::proxied pugwash URL leaked into the rendered page"; exit 1
          fi
          echo "Rendered page assertions passed."
