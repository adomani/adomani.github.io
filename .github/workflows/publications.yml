name: Validate publications pipeline

# Validate-only: builds and checks the generated publications page on PRs.
# It does NOT publish anything — the live site is deployed by GitHub Pages
# from the default branch. Canonical source: _bibliography/publications.json.

on:
  pull_request:
    paths:
      - '_bibliography/publications.json'
      - '_bibliography/papers.bib'
      - '_data/publications.yml'
      - '_data/collaborators.yml'
      - '_data/minicourses.yml'
      - '_data/talks.yml'
      - '_data/teaching.yml'
      - '_data/conferences.yml'
      - 'scripts/**'
      - '_includes/pub_entry.html'
      - 'papers/**'
      - 'minicourses/**'
      - 'slides/**'
      - 'tests/**'
      - 'assets/**'
      - '_config.yml'
      - '.github/workflows/publications.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml

      # 1. Golden-file checks: both generated artifacts are in sync with the JSON.
      #    Catches "edited the JSON but forgot to regenerate" and generator drift.
      - name: publications.yml is up to date with the JSON
        run: python3 scripts/publications.py --yaml _data/publications.yml --check
      - name: papers.bib is up to date with the JSON (CV round-trip)
        run: python3 scripts/publications.py --bib _bibliography/papers.bib --check

      # 2. Fixture test: pins JSON -> yaml and JSON -> bib output.
      - name: Generator fixture test
        run: python3 tests/test_publications.py
      - name: Minicourses generator test
        run: python3 tests/test_minicourses.py
      - name: Talks generator test
        run: python3 tests/test_talks.py
      - name: Teaching generator test
        run: python3 tests/test_teaching.py
      - name: Conferences generator test
        run: python3 tests/test_conferences.py
      - name: Slides generator test
        run: python3 tests/test_slides.py

      # 3. Build the whole site (catches Liquid/template/theme errors).
      #    Generate the /slides/ page first — it's built from the talk data.
      - name: Generate the /slides/ page from talks data
        run: python3 scripts/slides.py --out slides/index.md
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      # 4. Post-build assertions: the rendered page actually looks right.
      - name: Assert rendered publications page
        run: |
          set -euo pipefail
          f=_site/papers/index.html
          test -s "$f"
          grep -q "A Macaulay2-Lean interface for proofs in Lean" "$f"   # known entry
          grep -q "Gröbner" "$f"                                          # UTF-8 accent
          grep -q "Néron" "$f"
          grep -q '<details class="pub">' "$f"                            # collapsible entry present
          grep -q '<span class="pub-title">' "$f"                         # titles are wrapped/emphasised
          grep -q "theta-hyperplanes" "$f"                                # a migrated description
          grep -q 'href="https://anne.mx/"' "$f"                          # co-author homepage link
          grep -q "Dedicated to Tony Mach" "$f"                           # citation_note (dedication)
          grep -q 'supervisor <a href="https://www.math.columbia.edu/~dejong/"' "$f"  # thesis credit
          grep -qF '\(28\)' "$f"                                          # inline math for MathJax
          if grep -qE '\$[^$]*\\[a-zA-Z]+[^$]*\$' "$f"; then
            echo "::error::a raw \$...\$ math span leaked (site MathJax expects \\(..\\))"; exit 1
          fi
          if grep -q "pugwash" "$f"; then
            echo "::error::proxied pugwash URL leaked into the rendered page"; exit 1
          fi
          echo "Rendered page assertions passed."

      - name: Assert rendered slides page
        run: |
          set -euo pipefail
          f=_site/slides/index.html
          test -s "$f"
          grep -q "2021_11_29_lines_Alt.pdf" "$f"     # a slide PDF (shared data)
          grep -q "watch?v=734jMwgjkkM" "$f"          # a video link
          grep -q "Using computers to do maths for us" "$f"  # web_only entry present
          grep -q "Castravet-Tevelev" "$f"            # expository note
          if grep -qE '\$[^$]*\\[a-zA-Z]+[^$]*\$' "$f"; then
            echo "::error::a raw \$...\$ math span leaked on /slides/"; exit 1
          fi
          echo "Slides page assertions passed."
