title: "home"
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: dark

locale: en

markdown: kramdown
mathjax: true

navigation:
  main: main

enable_full_width: true

defaults:
- scope:
    path: ""
    type: "pages"
  values:
    sidebar: false

plugins:
- jekyll-remote-theme
- jekyll-include-cache
- jekyll-seo-tag
- jekyll-feed

# Keep build tooling and sources out of the published site — only the rendered
# pages and the CV *artifact* (pdfs/CV.pdf) are served, not the LaTeX sources or
# the Python pipeline. Setting `exclude` replaces Jekyll's defaults, so the
# standard ignores are repeated here.
exclude:
- .sass-cache/
- .jekyll-cache/
- gemfiles/
- Gemfile
- Gemfile.lock
- node_modules/
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/
- cv/          # LaTeX CV sources — the PDF is served from pdfs/CV.pdf instead
- scripts/     # Python build pipeline
- tests/       # generator self-checks
