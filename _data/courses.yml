# Course definitions for the website's teaching pages. Referenced by id from
# teaching/index.md and teaching/past_teaching/index.md via
#     {% include course.html id="tpwl" %}
# Define a course once here; every term that lists it links the same way.
#
#   title   (required)  the course code + name
#   url     (required)  primary link (external, or a relative course subpage)
#   links   (optional)  list of {label, url} extra material, shown as "(label)"
#   github  (optional)  a repo URL, shown as the GitHub icon
#   notes   (optional)  a short markdown sentence appended after the link
#
# NOTE: relative urls (e.g. "MA125/") resolve against the PAGE that includes the
# course, so a course with a relative url must only be listed on pages under the
# same path (in practice: past_teaching/). Courses shown on teaching/index.md use
# absolute urls.
