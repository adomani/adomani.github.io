- key: MR2375615
  title: Fano varieties in index one Fano complete intersections
  authors:
  - Damiano Testa
  year: '2008'
  venue: Mathematische Zeitschrift
  volume: '259'
  number: '1'
  pages: 61--64
  url: https://doi.org/10.1007/s00209-007-0211-7
  category: publications
  status: published
  description: |-
    A generalization of a result of Roya Beheshti and Jason Starr.
    The results in this paper imply that, for \\(n>4\\), a smooth hypersurface of degree \\(n\\) in
    \\(n\\)-dimensional projective space cannot be covered by Fano varieties (resp. toric varieties)
    of dimension between 2 and \\(n-3\\) (inclusive).
    (For comparison, Roya and Jason prove the same statement but only for Fano subvarieties of dimension 2,
    rather than the full range.)
    This is supporting evidence to the widely believed conjecture that there exist rationally connected varieties
    that are not unirational and that,
    more precisely, general hypersurfaces of degree \\(n\\) in \\(\mathbf{P}^n\\) should be examples,
    for \\(n\\) large enough.
- key: MR2358614
  title: Gröbner bases, monomial group actions, and the Cox rings of del Pezzo surfaces
  authors:
  - Mike Stillman
  - Damiano Testa
  - Mauricio Velasco
  year: '2007'
  venue: Journal of Algebra
  volume: '316'
  number: '2'
  pages: 777--801
  url: https://doi.org/10.1016/j.jalgebra.2007.05.016
  category: publications
  status: published
  description: |-
    My first paper on Cox rings.
    Using commutative algebra arguments, we exploit the action of the automorphism group of the Picard lattice
    of a del Pezzo surface to reduce a question of Batyrev and Popov on the Cox rings of del Pezzo surfaces
    to a completely mechanical verification.
    The main application is that we are able to use the computer to verify the conjecture for del Pezzo surfaces
    of degree at least three,
    a range that is still unreachable by brute force computations and that was also not known at the time.
    Later generalizations and computer-free proofs were found (also by myself!).
