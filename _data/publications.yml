- key: MR2824848
  title: Big rational surfaces
  authors:
  - Damiano Testa
  - Anthony Várilly-Alvarado
  - Mauricio Velasco
  year: '2011'
  venue: Mathematische Annalen
  volume: '351'
  number: '1'
  pages: 95--107
  url: https://doi.org/10.1007/s00208-010-0590-7
  category: publications
  status: published
  description: |-
    We present a unified approach to proving that smooth projective rational surfaces with
    big anti-canonical divisor have finitely generated Cox ring.
    Almost every previously known example was treated by ad hoc arguments on a case-by-case basis and
    is covered by our general result.
    Very few known examples of rational surfaces for which this statement was previously known are
    not covered by our result.
    We also provide many new examples.
    An explicit presentation in terms of generators and relations of the Cox ring of a variety is the main step
    in the explicit construction of a universal torsor on the variety itself.
- key: MR2718825
  title: Counting rational points on cubic curves
