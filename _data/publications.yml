- key: MR4518645
  title: Complex and tropical counts via positive characteristic
  authors:
  - Marco Pacini
  - Damiano Testa
  year: '2022'
  venue: Expositiones Mathematicae
  volume: '40'
  number: '4'
  pages: 1096--1115
  url: https://doi.org/10.1016/j.exmath.2022.07.003
  category: publications
  status: published
  description: |-
    The short version (*curves* are appropriately *general*):

    - A plane quartic has \\(28\\) bitangent lines, *unless* it is tropical or defined over a field of characteristic \\(2\\), in which case it has \\(7\\).

    - A plane curve of degree \\(d\\) has \\(3 d (d-2)\\) inflection lines, *unless* it is tropical or defined over a field of characteristic \\(3\\), in which case it has \\(d(d-2)\\).

    - A canonical curve of genus \\(g\\) has \\(2^{g-1} (2^g-1)\\) theta-hyperplanes, *unless* it is tropical or defined over a field of characteristic \\(2\\), in which case it has \\(2^g-1\\).

    We give a framework for analyzing these differences, by reduction to positive characteristic. As a consequence, we obtain divisibility properties for the numbers above:

    - clearly, \\(4\\) divides \\(28\\);
    - of course, \\(3\\) divides \\(3 d (d-2)\\);
    - unsurprisingly, \\(2^{g-1}\\) divides \\(2^{g-1} (2^g-1)\\).
- key: MR4088817
  title: On a question of Dolgachev
  authors:
  - Marco Pacini
  - Damiano Testa
  year: '2020'
  venue: Mathematical Research Letters
  volume: '27'
  number: '1'
  pages: 281--299
  category: publications
  status: published
  description: |-
    A classical construction in invariant theory associates to each quartic \\( Q \\) in \\( \mathbf{P}^2 \\), a quartic \\( H(Q) \\) in the dual projective plane \\( (\mathbf{P}^2)^\vee \\).
    Roughly, the points of \\( H(Q) \\) correspond to lines intersecting \\( Q \\) at a configuration of \\(4\\) points on \\( \mathbf{P}^1 \\) with vanishing \\( j \\)-invariant.
    Fix a general quartic \\( Q' \\) in \\( (\mathbf{P}^2)^\vee \\).
    Dolgachev asked how many quartics \\( Q \\) in \\( \mathbf{P}^2 \\) are there with \\( H(Q)=Q' \\).
    The answer is \\(15\\).
    The argument sheds **no** light on a possible interpretation of the number \\(15\\).
    (E.g. is \\( 15 = 3 \cdot 5 = 2^4-1 = \binom{6}{2} = \cdots \\)?).
