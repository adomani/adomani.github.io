  description: |-
    We show that the K3 surface arising from Büchi's problem is the Kummer surface of the Jacobian \\(J\\) of the genus two curve branched over an arithmetic progression of length 5.

    We then exploit that the abelian surface \\(J\\) is isogenous to a product of elliptic curves to conclude that the set of rational points on Büchi's K3 surface is Zariski dense.

    Finally we give a natural modular interpretation of Büchi's K3 surface as an irreducible component of the moduli space of rank two stable vector bundles on the Büchi K3 surface itself, opening the way for a modular solution to Büchi's problem.

    Erratum: In Theorem 3.7, the field \\(K\\) should be assumed infinite.
