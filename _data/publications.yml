- key: '1308.5517'
  title: The infinite random simplicial complex
  authors:
  - Andrew Brooke-Taylor
  - Damiano Testa
  year: '2013'
  url: https://arxiv.org/abs/1308.5517
  category: preprints
  status: preprint
  description: |-
    We introduce the *infinite random simplicial complex* \\(\Delta\\), a simplicial complex on a countable set of vertices.

    The infinite random simplicial complex \\(\Delta\\) is the simplicial complex obtained almost surely by the following procedure.

    For each pair of vertices, draw an edge between them with probability \\(\frac{1}{2}\\).

    Proceeding inductively, suppose that the \\((k-1)\\)-skeleton \\(\Delta_{k-1}\\) of \\(\Delta\\) has already been constructed.

    Let \\(v_0,\ldots,v_k\\) be a \\((k+1)\\)-tuple of vertices of \\(\Delta_{k-1}\\) with the property that every proper subset of \\(\{v_0,\ldots,v_k \}\\) forms a face of \\(\Delta_{k-1}\\).

    We add the \\(k\\)-dimensional face \\(\{v_0,\ldots,v_k \}\\) to the \\(k\\)-skeleton \\(\Delta_k\\) of \\(\Delta\\) with probability \\(\frac{1}{2}\\).
