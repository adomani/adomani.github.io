- key: MR3077175
  title: Nef and semiample divisors on rational surfaces
  authors:
  - Antonio Laface
  - Damiano Testa
  year: '2013'
  venue: Torsors, étale homotopy and applications to rational points
  volume: '405'
  pages: 429--446
  category: publications
  status: published
  description: |-
    We study the Cox rings of rational surfaces for which the anti-canonical divisor is (essentially) effective, finding conditions under which the Cox ring is finitely generated.

    We show that there is a curve of arithmetic genus one and a finitely generated subgroup of its Picard group that is finite if and only if every nef divisor on the surface is semi-ample.

    Thus we are able reduce the question of finite generation of Cox rings to the question of whether the semigroup of effective curves on the surface is finitely generated.

    We conclude with an example of a Mori dream rational surface with vanishing anticanonical Iitaka dimension.
