  url: https://doi.org/10.1007/s11425-010-4037-0
  category: publications
  status: published
  description: |-
    By a combination of the determinant method and \\(n\\)-descent on curves of genus one,
    we find bounds for the number of rational points on a smooth plane cubic curve that are uniform in
    the coefficients and depend explicitly on the rank of the Mordell-Weil group of the curve.
    The argument exploits an interplay between analytic techniques to bound the number of solutions to a cubic equation
    and a geometric interpretation of an evaluation map on an abelian surface leading to the required inequalities.
