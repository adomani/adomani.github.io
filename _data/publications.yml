- key: MR3296195
  title: Plane quartics with at least 8 hyperinflection points
  authors:
  - Marco Pacini
  - Damiano Testa
  year: '2014'
  venue: Bulletin of the Brazilian Mathematical Society. New Series. Boletim da Sociedade Brasileira de
    Matemática
  volume: '45'
  number: '4'
  pages: 819--836
  url: https://doi.org/10.1007/s00574-014-0077-3
  category: publications
  status: published
  description: |-
    We show that quartics over the complex numbers with at least eight hyperinflection lines are determined by their inflection lines.

    The result uses the classification of quartics with at least eight hyperinflection lines by Vermeulen and exploits the fact that all these quartics have dihedral groups in their automorphism groups.

    Our methods apply also in positive characteristic.

    Amusingly we find that the three plane quartics over \\(\mathbf{F}_{13}\\) with equations

    \\[
      x^4 + y^4 + z^4 + 3(x^2 y^2 + x^2 z^2 + y^2 z^2) = 0 \qquad
      x^4 + 3y^4 + 9z^4 + 3(9x^2 y^2 + 3x^2 z^2 + y^2 z^2) = 0 \qquad
      x^4 + 9y^4 + 3 z^4 + 3(3x^2 y^2 + 9x^2 z^2 + y^2 z^2) = 0
    \\]
    share the same inflection lines!

    The same property holds, over a field of characteristic 3 or 13, for the two quartics
    \\[
      x^4 -y^4 -z^4 = 2x^2 y^2 -4xyz^2 \qquad
      -(x^4 -y^4 +z^4) = 2x^2 y^2 -4xyz^2
    \\]
    and we show that among the Vermeulen's examples, these are essentially the only ones with this property.
