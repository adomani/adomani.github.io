- key: MR2579393
  title: Cox rings of degree one del Pezzo surfaces
  authors:
  - Damiano Testa
  - Anthony Várilly-Alvarado
  - Mauricio Velasco
  year: '2009'
  venue: Algebra & Number Theory
  volume: '3'
  number: '7'
  pages: 729--761
  url: https://doi.org/10.2140/ant.2009.3.729
  category: publications
  status: published
  description: |-
    We settle a conjecture of Batyrev and Popov on the ideal of relations of the Cox ring of a del Pezzo surface
    in the last remaining case of del Pezzo surfaces of degree one.
    Using techniques from commutative algebra, we transform the problem to a geometric question about
    the vanishing of certain cohomology groups of line bundles on the surface.
    We then analyze geometrically the various line bundles to reduce further the problem to a combinatorial
    question on configurations of exceptional curves on the surface.
    We finally solve the combinatorial question by explicit geometric arguments.
- key: MR2448278
  title: The irreducibility of the spaces of rational curves on del Pezzo surfaces
  authors:
  - Damiano Testa
  year: '2009'
  venue: Journal of Algebraic Geometry
  volume: '18'
  number: '1'
  pages: 37--61
  url: https://doi.org/10.1090/S1056-3911-08-00484-0
  category: publications
  status: published
  description: |-
    The main result is the proof that the spaces of rational curves on del Pezzo surfaces representing
    a fixed divisor class are either empty or irreducible, with one exception.
    The argument involves a detailed analysis of the possible singularities of (a partial resolution of)
    the moduli spaces of rational curves on surfaces and combines this with a degeneration argument to reduce
    all the rational curves in a fixed divisor class to a standard form.
    The relevant moduli spaces are sufficiently smooth that we can show that the various degenerations always
    take place within the smooth locus, proving the required irreducibility.
    (The longer, actual PhD thesis is available [here](https://arxiv.org/abs/math/0609355).)
  citation_note: PhD Thesis, supervisor [Johan de Jong](https://www.math.columbia.edu/~dejong/).
