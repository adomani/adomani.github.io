# Single source of truth for talks — the CV talks list and the website /slides/
# page are both generated from this. Newest first. Most entries are structured:
#   year, date, title, venue
# `title` and `venue` are MARKDOWN inline text: [label](url), *emphasis*, $math$,
# Unicode accents. _common.md_to_tex renders it to LaTeX for the CV;
# _common.md_to_web renders it for the website. A few heterogeneous entries
# (workshops, multi-talk series) keep the CV line verbatim in `text` (still LaTeX).
#
# Optional `slides:` is a URL; on the CV it renders as a trailing
# ", \href{url}{slides}." on the line. The website /slides/ page is generated
# from the subset with `slides` (scripts/slides.py), using two further fields the
# CV ignores: `video:` (URL) and `note:` (a short Markdown sentence).
#
# `web_only: true` marks an entry that appears on /slides/ but NOT in the CV's
# talks list — e.g. the Tour of Mathematics (which lives in the CV's Teaching
# section) and the Tsinghua minicourse slides. The CV generator skips these.
