{% if site.data.build.iso %}
<p class="page__footer-copyright" style="font-size: 0.7em; opacity: 0.8;">
  Last updated:
  <time datetime="{{ site.data.build.iso }}" id="site-updated">{{ site.data.build.date }}</time>
</p>
<script>
  // Reformat the build timestamp in the viewer's locale + timezone (the server
  // stamped it in UTC). Falls back to the UTC date if JS is off or parsing fails.
  (function () {
    var el = document.getElementById('site-updated');
    if (!el) return;
    var d = new Date(el.getAttribute('datetime'));
    if (isNaN(d.getTime())) return;
    el.textContent = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  })();
</script>
{% endif %}
