<p class="page__footer-copyright" style="font-size: 0.7em; opacity: 0.8;">
  Last updated:
  <time datetime="{{ site.time | date_to_xmlschema }}" id="site-updated">{{ site.time | date: "%-d %B %Y" }}</time>
</p>
<script>
  // site.time is the build timestamp (UTC on GitHub Pages). Reformat it in the
  // viewer's own locale + timezone; fall back to the UTC date if JS is off or
  // parsing fails.
  (function () {
    var el = document.getElementById('site-updated');
    if (!el) return;
    var d = new Date(el.getAttribute('datetime'));
    if (isNaN(d.getTime())) return;
    el.textContent = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  })();
</script>
