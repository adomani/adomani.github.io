<!-- MathJax v3, loaded from a maintained CDN. Included by _layouts/default.html
     on pages with `math: true`. Replaces the old MathJax v2 setup, which pointed
     at the retired cdn.mathjax.org (served only via a deprecation shim). -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      tags: 'ams'
    },
    options: {
      // Never typeset code/pre/verbatim spans (e.g. a literal `\(` in code).
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
